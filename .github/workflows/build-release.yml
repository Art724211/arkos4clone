name: ArkOS4Clone的构建和发布

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            parted \
            rsync \
            xz-utils \
            wget \
            unzip \
            golang-go \
            exfat-fuse \
            exfatprogs \
            e2fsprogs \
            dosfstools \
            btrfs-progs \
            f2fs-tools \
            p7zip-full

      - name: Download & extract source image
        run: |
          BASE_NAME="dArkOS_RG351MP_trixie_06072026.img.7z"
          URL_DIR="https://github.com/christianhaitian/dArkOS/releases/download/v06072026"
          
          echo "=== 1. Baixando arquivos ==="
          for i in 001 002; do
            echo "Tentando baixar parte $i..."
            curl -fL "${URL_DIR}/${BASE_NAME}.${i}" -o "${BASE_NAME}.${i}" || { 
              echo "❌ ERRO: O download da parte $i falhou!"
              exit 1 
            }
          done
          
          echo "=== 2. Verificando o tamanho dos arquivos baixados ==="
          ls -lh ${BASE_NAME}.*
          
          echo "=== 3. Extraindo 7z ==="
          7z x "${BASE_NAME}.001" -o. -y || {
            echo "❌ ERRO: O 7z falhou ao extrair."
            exit 1
          }
          
          echo "=== 4. Deletando partes 7z para liberar espaço ==="
          rm -f ${BASE_NAME}.*
          
          echo "=== 5. Verificando a imagem extraída ==="
          IMG_FILE=$(ls *.img 2>/dev/null | head -1)
          if [ -z "$IMG_FILE" ]; then
            echo "❌ ERRO: Arquivo .img não encontrado após a extração!"
            exit 1
          fi
          echo "✅ Sucesso! Imagem base: $IMG_FILE ($(du -h "$IMG_FILE" | cut -f1))"

      - name: Build image
        run: |
          chmod +x build_image.sh grow_p2_plus.sh mount_arkos.sh clone_support.sh build_dtb_selector.sh uboot/flash_uboot.sh
          mkdir -p bin/pm_libs mnt
          sudo ./build_image.sh $(ls *.img) .

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          XZ_FILE=$(ls *.img.xz 2>/dev/null | head -1)
          if [ -z "$XZ_FILE" ]; then
            echo "ERROR: No .img.xz found"
            exit 1
          fi
          BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)
          FILE_SIZE=$(stat -c%s "$XZ_FILE")
          LIMIT=$((1900 * 1024 * 1024))

          if [ "$FILE_SIZE" -gt "$LIMIT" ]; then
            echo "文件超过1900M，7z分卷压缩..."
            7z a -v1900m -mx=0 "${XZ_FILE}.7z" "$XZ_FILE"
            FILES=$(ls ${XZ_FILE}.7z.* | tr '\n' ' ')
          else
            FILES="$XZ_FILE"
          fi

          echo "上传文件: $FILES"
          gh release create "$BUILD_DATE" \
            $FILES \
            --title "ArkOS4Clone-$BUILD_DATE" \
            --notes "ArkOS4Clone 构建版本 - $BUILD_DATE" \
            --draft=true
