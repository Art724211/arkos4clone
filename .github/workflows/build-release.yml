name: Bandido quer 67

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            parted \
            rsync \
            xz-utils \
            wget \
            unzip \
            golang-go \
            exfat-fuse \
            exfatprogs \
            e2fsprogs \
            dosfstools \
            btrfs-progs \
            f2fs-tools \
            p7zip-full

      - name: Download & extract source image
        run: |
          # Definição das novas variáveis com base no repositório dArkOS
          BASE_NAME="dArkOS_RG351MP_trixie_06072026.img.7z"
          URL_DIR="https://github.com/christianhaitian/dArkOS/releases/download/trixie"
          
          echo "=== 下载分卷 ==="
          for i in 001 002; do
            echo "Downloading part $i ..."
            wget --progress=bar:force:noscroll "${URL_DIR}/${BASE_NAME}.${i}" && echo "part $i done" || { echo "Failed to download part $i"; exit 1; }
          done
          
          echo "=== 解压 7z 分卷 ==="
          # O 7z localiza automaticamente a parte .002 no mesmo diretório
          7z x "${BASE_NAME}.001" -o. -y
          
          echo "=== 删除 7z 压缩包释放空间 ==="
          rm -f ${BASE_NAME}.*
          
          echo "=== 确认 img ==="
          IMG_FILE=$(ls *.img 2>/dev/null | head -1)
          if [ -z "$IMG_FILE" ]; then
            echo "ERROR: Final .img file not found!"
            exit 1
          fi
          echo "Source image: $IMG_FILE ($(du -h "$IMG_FILE" | cut -f1))"

      - name: Build image
        run: |
          chmod +x build_image.sh grow_p2_plus.sh mount_arkos.sh clone_support.sh build_dtb_selector.sh uboot/flash_uboot.sh
          mkdir -p bin/pm_libs mnt
          sudo ./build_image.sh $(ls *.img) .

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          XZ_FILE=$(ls *.img.xz 2>/dev/null | head -1)
          if [ -z "$XZ_FILE" ]; then
            echo "ERROR: No .img.xz found"
            exit 1
          fi
          BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)
          FILE_SIZE=$(stat -c
